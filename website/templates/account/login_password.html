{% extends 'allauth/layouts/entrance.html' %}
{% block head_title %}Enter your password{% endblock %}
{% block content %}
<p class="kicker">WELCOME BACK</p><h1>Enter your password.</h1><p class="selected-identity">{{ selected_email }}</p>
<form method="post" action="{% url 'account_password_login' %}">{% csrf_token %}{{ form.as_p }}{{ redirect_field }}<button class="primary full" type="submit">Sign in</button></form>
<a class="auth-link" href="{% url 'account_reset_password' %}">Forgot your password?</a>
<form method="post" action="{% url 'account_restart_login' %}">{% csrf_token %}<button class="quiet" type="submit">Use a different email</button></form>
{% endblock %}
